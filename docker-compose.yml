version: '3.8'

services:
  db:
    container_name: db_postgres
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: Sistema-Escolar
      POSTGRES_USER: Barrdo
      POSTGRES_PASSWORD: 181528
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: